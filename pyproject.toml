[project]
name = "fifo-directory-queue"
version = "0.1.0"
description = "A crash-safe FIFO work queue using files in a directory without a database."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
